name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Sanitizers and firmware native checks
        run: python3 scripts/test-sdk.py
      - name: Standalone CMake consumers
        run: |
          cmake -S sdk/Mochi -B build/sdk -DMOCHI_BUILD_TESTS=ON -DMOCHI_BUILD_EXAMPLE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk
          ctest --test-dir build/sdk --output-on-failure
          ./build/sdk/mochi_offscreen build/mochi.ppm
          ./build/sdk/mochi_cast build/cast.ppm
          ./build/sdk/mochi_application build/application.ppm
          ./build/sdk/mochi_stripes build/stripes.ppm
      - name: Installed package in an independent application
        run: python3 scripts/test-install.py

  browser:
    name: Browser reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run test:web

  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build the board example
        run: pio run --project-dir firmware
      - name: Build the FreeRTOS application example
        run: pio run --project-dir examples/freertos_companion
